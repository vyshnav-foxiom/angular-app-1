<div class="login-container">
  <h1 class="v1">Login</h1>

  <input type="email" placeholder="Email" [ngModel]="email()" (ngModelChange)="email.set($event)"/>

<input type="password" placeholder="Password" [ngModel]="password()" (ngModelChange)="password.set($event)" />

  <button (click)="onLogin()">Login</button>


  @if(errorMessage()){
    <p style="color: red;">{{ errorMessage() }}</p>
  }
</div>
